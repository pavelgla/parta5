services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://parta5:${POSTGRES_PASSWORD}@db:5432/parta5
      - AUTH_SECRET=${AUTH_SECRET}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parta5
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: parta5
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parta5']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    command: pnpm --filter @parta5/db exec prisma migrate deploy
    environment:
      - DATABASE_URL=postgresql://parta5:${POSTGRES_PASSWORD}@db:5432/parta5
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

volumes:
  pgdata:
